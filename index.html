<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#172b25">
<meta name="description" content="Jamila Bakery & Coffee House — سيتم الإطلاق قريباً خلال أيام معدودة إن شاء الله.">
<title>Jamila | قريباً سيتم الإطلاق</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:wght@400;500;600;700&display=swap');
:root{--green:#172b25;--green2:#233d32;--cream:#f3ead8;--gold:#bd9a61;--rust:#9a5145;}
*{box-sizing:border-box}
html{min-height:100%;background:var(--green)}
body{margin:0;min-height:100vh;color:var(--cream);font-family:'Amiri',Georgia,serif;background:
radial-gradient(ellipse at 50% 40%,rgba(189,154,97,.12),transparent 55%),
linear-gradient(135deg,#101f1a,#1b332a 55%,#101f1a);display:grid;place-items:center;padding:24px;overflow-x:hidden}
body:before{content:"";position:fixed;inset:12px;border:1px solid rgba(189,154,97,.6);pointer-events:none}
body:after{content:"";position:fixed;inset:20px;border:1px solid rgba(189,154,97,.22);pointer-events:none}
.page{width:min(880px,100%);position:relative;text-align:center;padding:clamp(32px,7vw,72px) clamp(20px,6vw,68px);border:1px solid var(--gold);outline:1px solid rgba(189,154,97,.25);outline-offset:8px;background:linear-gradient(160deg,rgba(255,255,255,.035),rgba(0,0,0,.08));box-shadow:0 25px 90px #07110d88}
.corner{position:absolute;width:42px;height:42px;border-color:var(--gold);opacity:.9}
.tl{top:10px;left:10px;border-top:2px solid;border-left:2px solid}.tr{top:10px;right:10px;border-top:2px solid;border-right:2px solid}.bl{bottom:10px;left:10px;border-bottom:2px solid;border-left:2px solid}.br{bottom:10px;right:10px;border-bottom:2px solid;border-right:2px solid}
.eyebrow{font-family:'Cormorant Garamond',serif;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);font-size:14px;direction:ltr;margin:0 0 24px}
.logo-frame{width:min(500px,100%);margin:0 auto 28px;padding:8px;background:var(--cream);border:1px solid var(--gold);box-shadow:0 10px 28px #0004}
.logo-frame img{display:block;width:100%;height:auto;max-height:none;object-fit:contain;object-position:center}
h1{font-size:clamp(32px,6vw,56px);line-height:1.35;margin:10px 0;color:var(--cream);font-weight:700}
h1 span{color:var(--gold);display:block;font-size:.7em;margin-top:2px}
.rule{display:flex;align-items:center;justify-content:center;gap:14px;margin:25px auto;max-width:360px;color:var(--gold)}
.rule:before,.rule:after{content:"";height:1px;background:var(--gold);flex:1;opacity:.75}
.diamond{width:9px;height:9px;border:1px solid var(--gold);transform:rotate(45deg)}
.desc{font-size:clamp(17px,2.5vw,22px);line-height:1.9;margin:0 auto 26px;max-width:590px;color:#e8dcc7}
.brand{font-family:'Cormorant Garamond',serif;direction:ltr;font-size:clamp(17px,3vw,24px);letter-spacing:.08em;color:var(--gold);margin:8px 0 30px}
.contact{display:inline-flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;background:var(--rust);color:#fff4e4;padding:13px 28px;border:1px solid #d3a18b;box-shadow:0 6px 18px #0003;transition:transform .2s,background .2s;font-size:18px}
.contact:hover{transform:translateY(-3px);background:#ad6254}
.wa{width:22px;height:22px;flex:none}
.credit{margin:34px 0 0;color:#c9b99e;font-size:15px}
.credit strong{color:var(--gold);font-weight:700}
.small{direction:ltr;font:12px 'Cormorant Garamond',serif;letter-spacing:.16em;color:#b4a487;margin-top:10px}
.media-link{display:inline-flex;align-items:center;gap:7px;color:var(--gold);text-decoration:none;white-space:nowrap}.media-link .wa{width:19px;height:19px}.media-link:hover{color:#e6c88e}
@media(max-width:480px){body{padding:20px}body:before{inset:7px}body:after{inset:13px}.page{padding:38px 22px}.logo-frame img{max-height:none}.contact{width:100%;padding:12px 14px}}

/* Final typography, spacing, and logo-panel refinements */
body{
  padding:clamp(22px,4vw,42px);
}
.page{
  width:min(820px,100%);
  padding:clamp(30px,5.5vw,58px) clamp(22px,6vw,64px);
}
.eyebrow{
  letter-spacing:.16em;
  line-height:1.6;
  margin:0 0 22px;
}
.logo-frame{
  width:min(470px,100%);
  margin:0 auto 34px;
  padding:0;
  overflow:hidden;
  background:#f6ead0;
  border:1px solid rgba(189,154,97,.9);
  border-radius:2px;
  box-shadow:0 12px 32px rgba(0,0,0,.28);
  line-height:0;
}
.logo-frame img{
  display:block;
  width:100%;
  height:auto;
  max-height:none;
  object-fit:contain;
  object-position:center;
}
h1{
  line-height:1.55;
  letter-spacing:0;
  margin:0 auto 12px;
  max-width:650px;
  text-wrap:balance;
}
h1 span{
  margin-top:10px;
  line-height:1.65;
}
.rule{
  margin:27px auto;
  gap:16px;
}
.desc{
  font-size:clamp(18px,2.3vw,22px);
  line-height:2;
  letter-spacing:0;
  max-width:560px;
  margin:0 auto 24px;
  text-wrap:pretty;
}
.brand{
  line-height:1.6;
  letter-spacing:.11em;
  margin:18px auto 0;
  overflow-wrap:anywhere;
}
.credit{
  max-width:560px;
  margin:26px auto 0;
  font-size:clamp(16px,2vw,18px);
  line-height:2;
  text-wrap:balance;
}
.credit strong{display:inline-block;padding-inline:2px}
.media-link{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  white-space:normal;
  vertical-align:middle;
  margin-inline-start:3px;
}
.media-link .wa{width:20px;height:20px}
.small{
  line-height:1.8;
  letter-spacing:.12em;
  margin-top:14px;
}
@media(max-width:480px){
  body{padding:18px}
  body:before{inset:7px}
  body:after{inset:13px}
  .page{padding:32px 20px}
  .eyebrow{font-size:12px;margin-bottom:18px}
  .logo-frame{width:100%;margin-bottom:27px}
  h1{font-size:clamp(30px,8.5vw,40px);line-height:1.5}
  h1 span{font-size:.72em;margin-top:8px}
  .rule{margin:22px auto;gap:12px}
  .desc{font-size:18px;line-height:1.95;margin-bottom:20px}
  .brand{font-size:17px;letter-spacing:.07em}
  .credit{font-size:16px;line-height:2.05;margin-top:22px}
  .small{font-size:11px;letter-spacing:.08em}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;transition:none!important}
}


/* Logo integrated with the forest-green page background */
.logo-frame{
  width:min(470px,100%);
  margin:0 auto 30px;
  padding:0;
  background:transparent;
  border:0;
  border-radius:0;
  box-shadow:none;
  outline:0;
  overflow:visible;
  line-height:0;
}
.logo-frame img{
  display:block;
  width:100%;
  height:auto;
  max-height:none;
  object-fit:contain;
  object-position:center;
  filter:drop-shadow(0 8px 18px rgba(0,0,0,.18));
}
@media(max-width:480px){
  .logo-frame{width:min(100%,390px);margin-bottom:24px}
}

</style>
</head>
